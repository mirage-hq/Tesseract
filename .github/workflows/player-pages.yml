name: Deploy player to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - player/**
      - skills/tesseract-editor/references/cli-version.txt
      - .github/workflows/player-pages.yml
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Download the pinned CDN runtime
        run: |
          version=$(cat skills/tesseract-editor/references/cli-version.txt)
          [[ "$version" =~ ^0\.[0-9]+\.0$ ]]
          mkdir -p player/runtime
          for file in web_api.js web_api_bg.wasm TERMS.md THIRD_PARTY_NOTICES.md; do
            curl --fail --location --retry 3 "https://captions-cdn.com/tesseract/$version/$file" --output "player/runtime/$file"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: player
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
