name: Deploy player to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - player/**
      - skills/tesseract-editor/references/cli-version.txt
      - .github/workflows/player-pages.yml
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure the pinned CDN runtime
        run: |
          version=$(cat skills/tesseract-editor/references/cli-version.txt)
          [[ "$version" =~ ^0\.[0-9]+\.0$ ]]
          mkdir -p player/runtime
          printf 'export { default } from "https://captions-cdn.com/tesseract/%s/web_api.js";\nexport * from "https://captions-cdn.com/tesseract/%s/web_api.js";\n' "$version" "$version" > player/runtime/web_api.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: player
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
